[package]
name = "php_oxidized"
version = "0.1.0"
edition = "2021"

[lib]
name = "php_oxidized"
crate-type = ["staticlib"]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.70"
cc = "1.0"

[features]
default = []
zts = []  # Thread-safe build
debug = []  # Debug build with extra checks

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
